{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="text-center text-success mb-4">Восстановление пароля</h2>
                    <p class="text-muted text-center">
                        Введите ваш email, и мы вышлем инструкции для восстановления пароля.
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" id="id_email" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Отправить инструкции</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-success">Вернуться к входу</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    main {
        flex: 1;
        padding-top: 0;
    }
    
    .container.mt-4.pt-5 {
        margin-top: 2rem !important;
        padding-top: 3rem !important;
    }
    
    @media (max-width: 768px) {
        .container.mt-4.pt-5 {
            margin-top: 1rem !important;
            padding-top: 2rem !important;
        }
    }
</style>
{% endblock %}
