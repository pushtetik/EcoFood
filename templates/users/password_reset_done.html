{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4 text-center">
                    <h2 class="text-center text-success mb-4">Письмо отправлено</h2>
                    
                    <div class="alert alert-info">
                        <p class="mb-0">
                            Мы отправили вам инструкции по восстановлению пароля на указанный email. 
                            Если вы не получили письмо, проверьте папку "Спам" или убедитесь, 
                            что ввели правильный email.
                        </p>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="btn btn-success">Вернуться к входу</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    main {
        flex: 1;
        padding-top: 0;
    }
    
    .container.mt-4.pt-5 {
        margin-top: 2rem !important;
        padding-top: 3rem !important;
    }
    
    @media (max-width: 768px) {
        .container.mt-4.pt-5 {
            margin-top: 1rem !important;
            padding-top: 2rem !important;
        }
    }
</style>
{% endblock %}
